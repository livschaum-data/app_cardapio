<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Planejador de Cardápio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- ==================== HEADER ====================
             Cabeçalho com título e menu principal -->
        <header class="header">
            <h1>🍽️ Planejador de Cardápio</h1>
            <nav class="menu-principal">
                <button class="menu-btn" onclick="abrirModalReceita()">
                    ➕ Nova Receita
                </button>
                <button class="menu-btn" onclick="abrirTiposRefeicao()">
                    ⚙️ Tipos de Refeição
                </button>
                <button class="menu-btn" onclick="abrirHistorico()">
                    📊 Histórico
                </button>
            </nav>
        </header>

        <!-- ==================== ABAS DE NAVEGAÇÃO ====================
             Botões para alternar entre visualizações -->
        <div class="abas">
            <button class="aba-btn ativo" onclick="mostrarVisao('semanal')">
                📅 Semanal
            </button>
            <button class="aba-btn" onclick="mostrarVisao('mensal')">
                📆 Mensal
            </button>
            <button class="aba-btn" onclick="mostrarVisao('diaria')">
                📊 Diária
            </button>
            <button class="aba-btn" onclick="mostrarVisao('calendario')">
                🗓️ Calendário
            </button>
            <button class="aba-btn" onclick="mostrarVisao('receitas')">
                📚 Receitas
            </button>
        </div>

        <!-- ==================== VISÃO SEMANAL ====================
             Tabela com 7 dias e tipos de refeição -->
        <div id="visao-semanal" class="visao">
            <div class="controles">
                <button onclick="semanaAnterior()">← Semana Anterior</button>
                <h2 id="titulo-semana">Semana 1</h2>
                <button onclick="proxSemana()">Próxima Semana →</button>
                <input type="number" id="numero-semana" min="1" max="52" 
                       onchange="mudarSemana(this.value)" 
                       style="width: 60px; padding: 8px; margin-left: 20px;">
            </div>

            <div class="tabela-container">
                <table class="tabela-semanal">
                    <thead>
                        <tr>
                            <th>Refeição</th>
                            <th>Domingo</th>
                            <th>Segunda</th>
                            <th>Terça</th>
                            <th>Quarta</th>
                            <th>Quinta</th>
                            <th>Sexta</th>
                            <th>Sábado</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela-semanal">
                        <!-- Preenchida dinamicamente pelo JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ==================== VISÃO MENSAL ====================
             Múltiplas semanas -->
        <div id="visao-mensal" class="visao" style="display:none;">
            <div class="controles">
                <button onclick="mesAnterior()">← Mês Anterior</button>
                <h2 id="titulo-mes">Janeiro 2024</h2>
                <button onclick="proxMes()">Próximo Mês →</button>
            </div>

            <div id="container-semanas-mensais" class="container-semanas">
                <!-- Múltiplas tabelas de semanas -->
            </div>
        </div>

        <!-- ==================== VISÃO DIÁRIA ====================
             Refeições do dia -->
        <div id="visao-diaria" class="visao" style="display:none;">
            <div class="controles">
                <button onclick="diaAnterior()">← Dia Anterior</button>
                <h2 id="titulo-dia">Segunda, 1 de Janeiro</h2>
                <button onclick="proximoDia()">Próximo Dia →</button>
                <input type="date" id="data-diaria" onchange="mudarDataDiaria(this.value)"
                       style="padding: 8px; margin-left: 20px;">
            </div>

            <div id="container-diaria" class="container-diaria">
                <!-- Refeições do dia -->
            </div>
        </div>

        <!-- ==================== VISÃO CALENDÁRIO ====================
             Calendário interativo -->
        <div id="visao-calendario" class="visao" style="display:none;">
            <div class="controles">
                <button onclick="mesCalendarioAnterior()">← Anterior</button>
                <h2 id="titulo-calendario">Janeiro 2024</h2>
                <button onclick="proxMesCalendario()">Próximo →</button>
            </div>

            <div class="calendario-container">
                <div id="calendario" class="calendario">
                    <!-- Dias do calendário -->
                </div>
                
                <div id="detalhes-data" class="detalhes-data">
                    <h3>Data Selecionada</h3>
                    <p id="data-selecionada">Nenhuma</p>
                    <div id="refeicoes-data" class="refeicoes-data">
                        <!-- Refeições da data -->
                    </div>
                    <button onclick="adicionarRefeicaoData()">
                        ➕ Adicionar Refeição
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== VISÃO RECEITAS ====================
             Lista de todas as receitas -->
        <div id="visao-receitas" class="visao" style="display:none;">
            <div class="controles">
                <input type="text" id="busca-receitas" placeholder="🔍 Buscar receita..."
                       onkeyup="filtrarReceitas()">
                <select id="filtro-categoria" onchange="filtrarReceitas()">
                    <option value="">Todas as categorias</option>
                    <!-- Opções preenchidas dinamicamente -->
                </select>
            </div>

            <div id="lista-receitas" class="lista-receitas">
                <!-- Cards de receitas -->
            </div>
        </div>

        <!-- ==================== MODAL: NOVA RECEITA ====================
             Formulário para adicionar/editar receita -->
        <div id="modal-receita" class="modal" style="display:none;">
            <div class="modal-content">
                <button class="btn-fechar" onclick="fecharModal('modal-receita')">✕</button>
                <h2>Nova Receita</h2>

                <form id="form-receita">
                    <div class="form-grupo">
                        <label>Nome da Receita *</label>
                        <input type="text" id="nome-receita" required>
                    </div>

                    <div class="form-grupo">
                        <label>Tipo de Refeição *</label>
                        <select id="tipo-refeicao" required>
                            <!-- Preenchido dinamicamente -->
                        </select>
                    </div>

                    <div class="form-grupo">
                        <label>Categoria</label>
                        <select id="categoria-receita">
                            <option value="">Sem categoria</option>
                            <option value="Doce">Doce</option>
                            <option value="Salgado">Salgado</option>
                            <option value="Vegetariano">Vegetariano</option>
                            <option value="Vegan">Vegan</option>
                            <option value="Sem Glúten">Sem Glúten</option>
                            <option value="Sem Lactose">Sem Lactose</option>
                        </select>
                    </div>

                    <div class="form-grupo">
                        <label>Ingredientes (um por linha)</label>
                        <textarea id="ingredientes-receita" placeholder="Cenoura&#10;Batata&#10;Água"></textarea>
                    </div>

                    <div class="form-grupo">
                        <label>Modo de Preparo</label>
                        <textarea id="preparo-receita" placeholder="Descreva o modo de preparo..."></textarea>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="button" class="btn-secundario" 
                                onclick="fecharModal('modal-receita')">
                            Cancelar
                        </button>
                        <button type="submit" class="btn-principal">
                            Salvar Receita
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ==================== MODAL: SELECIONAR RECEITA ====================
             Para planejar uma refeição -->
        <div id="modal-selecionar-receita" class="modal" style="display:none;">
            <div class="modal-content">
                <button class="btn-fechar" onclick="fecharModal('modal-selecionar-receita')">✕</button>
                <h2>Selecionar Receita</h2>

                <input type="text" id="busca-selecionar" placeholder="🔍 Buscar receita..."
                       onkeyup="buscarReceitasModal()" style="width: 100%; padding: 10px; margin-bottom: 20px;">

                <div id="lista-selecionar-receita" class="lista-receitas-modal">
                    <!-- Receitas para selecionar -->
                </div>
            </div>
        </div>

        <!-- ==================== MODAL: TIPOS DE REFEIÇÃO ====================
             Gerenciar tipos customizados -->
        <div id="modal-tipos-refeicao" class="modal" style="display:none;">
            <div class="modal-content">
                <button class="btn-fechar" onclick="fecharModal('modal-tipos-refeicao')">✕</button>
                <h2>Tipos de Refeição</h2>

                <div class="form-grupo">
                    <label>Adicionar novo tipo</label>
                    <input type="text" id="novo-tipo-refeicao" placeholder="Ex: Café da Manhã">
                    <button onclick="adicionarTipoRefeicao()" class="btn-principal" style="margin-top: 10px;">
                        ➕ Adicionar
                    </button>
                </div>

                <h3 style="margin-top: 20px;">Tipos Atuais</h3>
                <div id="lista-tipos-refeicao" class="lista-tipos">
                    <!-- Tipos preenchidos dinamicamente -->
                </div>
            </div>
        </div>

        <!-- ==================== MODAL: HISTÓRICO ====================
             Ver estatísticas de uso -->
        <div id="modal-historico" class="modal" style="display:none;">
            <div class="modal-content">
                <button class="btn-fechar" onclick="fecharModal('modal-historico')">✕</button>
                <h2>Histórico de Consumo</h2>

                <div id="lista-historico" class="lista-historico">
                    <!-- Estatísticas de cada receita -->
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== SCRIPTS ====================
         Carrega o JavaScript da app -->
    <script src="js/app.js"></script>
</body>
</html>

<!-- 
    💡 ESTRUTURA HTML:

    1. HEADER
       - Título
       - Menu com botões principais

    2. ABAS
       - 5 botões para trocar de visão
       - onclick chama mostrarVisao()

    3. VISÕES (5 no total)
       - Semanal: Tabela 7 dias
       - Mensal: Múltiplas semanas
       - Diária: Refeições do dia
       - Calendário: Data específica
       - Receitas: Lista de receitas

    4. MODAIS (Popups)
       - Receita: Adicionar/editar
       - Selecionar: Escolher receita para planejar
       - Tipos: Gerenciar tipos de refeição
       - Histórico: Ver estatísticas

    PRÓXIMO: Abra css/style.css
-->
